name: Publish signed TV update

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AuroraTV
    env:
      UPDATE_GITHUB_REPOSITORY: ${{ github.repository }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/giztv-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/giztv-release.jks" >> "$GITHUB_ENV"

      - name: Verify tag matches the app version
        run: |
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -1)"
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          test "v$VERSION_NAME" = "$GITHUB_REF_NAME"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: |
          test -n "$TMDB_API_KEY"
          bash ./gradlew :app:assembleRelease

      - name: Create update metadata
        run: |
          APK_SOURCE="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' -print -quit)"
          test -n "$APK_SOURCE"
          APK_NAME="GIZTV-$GITHUB_REF_NAME.apk"
          cp "$APK_SOURCE" "$APK_NAME"
          APK_SHA256="$(sha256sum "$APK_NAME" | cut -d ' ' -f 1)"
          APK_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$APK_NAME"
          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg apkUrl "$APK_URL" \
            --arg sha256 "$APK_SHA256" \
            --arg releaseNotes "A new GIZTV update with the latest playback, performance, and interface improvements." \
            '{versionCode: $versionCode, versionName: $versionName, apkUrl: $apkUrl, sha256: $sha256, releaseNotes: $releaseNotes}' \
            > update.json
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK_NAME" update.json \
            --title "GIZTV $GITHUB_REF_NAME" \
            --generate-notes
