name: Publish signed TV update

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GIZTV
    # No ANDROID_KEYSTORE_* here on purpose. The secret keystore predates the permanent key and
    # signs with a different certificate, so a release built from it cannot install over v1.52.0.
    # Leaving those unset makes the build fall back to app/giztv.keystore, the permanent key every
    # release from v1.52.0 onwards is signed with.
    env:
      UPDATE_GITHUB_REPOSITORY: ${{ github.repository }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify the permanent signing key is present
        run: test -f app/giztv.keystore

      - name: Verify tag matches the app version
        run: |
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -1)"
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          test "v$VERSION_NAME" = "$GITHUB_REF_NAME"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: |
          test -n "$TMDB_API_KEY"
          bash ./gradlew :app:assembleRelease

      - name: Create update metadata
        env:
          # What changed in this build, and nothing else. Edit this every release.
          RELEASE_NOTES: |
            Fixes for 1.70.0, which made films slower to start and more likely to stop:

            - The first film of a session opens carefully again. Only a link measured while
              actually watching something, minutes earlier, now lets the next film open higher —
              and never at the top of the range, which is still earned by playing without
              interruption.
            - A speed learned on Wi-Fi is no longer assumed of a cellular connection.
            - Building the store of kept video no longer happens while you are waiting for a
              picture, and the network connection is opened once for the app rather than rebuilt
              for every film. Both were adding to the wait before playback began.
            - Playlists are no longer kept, only video. A kept playlist's links expire within
              hours, which could break a title on a later viewing.
            - Each playback now writes a line of diagnostics, so a report of "it feels slower"
              has numbers behind it next time.
          # 1.53.0 changed applicationId, so anything older than it still cannot be updated over
          # and has to be reinstalled by hand. Kept apart from the notes above so the release page
          # can put the first-install block between the two. Drop this once 1.52.x is gone.
          UPGRADE_NOTES: |
            Already on 1.53.0 or newer? This installs itself as usual.

            On 1.52.1 or older? 1.53.0 changed the app's identity, so Android will not install this
            over your copy and the in-app update stops with "The downloaded update belongs to a
            different app." Uninstall GIZTV once, then install this build from the release page.
            Watch history does not carry across that one reinstall. Updates after it are automatic.
        run: |
          APK_SOURCE="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' -print -quit)"
          test -n "$APK_SOURCE"
          APK_NAME="GIZTV-$GITHUB_REF_NAME.apk"
          cp "$APK_SOURCE" "$APK_NAME"
          APK_SHA256="$(sha256sum "$APK_NAME" | cut -d ' ' -f 1)"
          APK_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$APK_NAME"
          # A YAML block scalar keeps its trailing newline and command substitution drops one, so
          # both halves are stripped bare here and every blank line below is put in deliberately.
          CHANGED_NOTES="$(printf '%s' "$RELEASE_NOTES")"
          UPGRADE_TEXT="$(printf '%s' "$UPGRADE_NOTES")"
          # The in-app update screen is read by people who already have GIZTV installed, so it
          # carries what changed and the upgrade path — and not the first-install block below.
          IN_APP_NOTES="$(printf '%s\n\n%s\n' "$CHANGED_NOTES" "$UPGRADE_TEXT")"
          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg apkUrl "$APK_URL" \
            --arg sha256 "$APK_SHA256" \
            --arg releaseNotes "$IN_APP_NOTES" \
            '{versionCode: $versionCode, versionName: $versionName, apkUrl: $apkUrl, sha256: $sha256, releaseNotes: $releaseNotes}' \
            > update.json

          # The release page carries the sideload prompts as well, between what changed and the
          # upgrade path: it is where someone installing for the first time lands, and meeting
          # Play Protect unwarned is what makes them close the tab. The in-app notes above leave
          # it out on purpose — everyone reading those has the app installed already.
          {
            printf '%s\n' "$CHANGED_NOTES"
            cat <<NOTES

          Installing this for the first time?

          Android will ask two things, and both are normal:

          1. "Install unknown apps" — allow it for whichever browser or file manager you
             opened the APK with. Android asks once.
          2. "App scan recommended" / "Send app to Play Protect?" — tap Scan and let it
             finish. It passes.

          Neither is a warning that something was found. Play Protect trusts an app by how
          widely it has seen that app's package and signing key together, and GIZTV is
          published here rather than on the Play Store, so it stays unrecognised no matter
          how the app is built.

          Verify the download before installing it if you like:

              SHA-256  $APK_SHA256

              Windows      Get-FileHash .\\$APK_NAME -Algorithm SHA256
              Mac / Linux  shasum -a 256 $APK_NAME

          Updates after this one install themselves — this is a one-time step.

          NOTES
            printf '%s\n' "$UPGRADE_TEXT"
          } > release-notes.md

          # R8 renames everything, so a crash report from the field is unreadable without the
          # mapping for the exact build it came from. It ships with the release for that reason —
          # compressed, because the raw file is the best part of a hundred megabytes.
          MAPPING_SOURCE="app/build/outputs/mapping/release/mapping.txt"
          MAPPING_NAME="GIZTV-$GITHUB_REF_NAME-mapping.txt.gz"
          test -f "$MAPPING_SOURCE"
          gzip -c "$MAPPING_SOURCE" > "$MAPPING_NAME"

          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "MAPPING_NAME=$MAPPING_NAME" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK_NAME" "$MAPPING_NAME" update.json \
            --title "GIZTV $GITHUB_REF_NAME" \
            --notes-file release-notes.md
